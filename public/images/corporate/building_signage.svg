<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Dark Granite / Titanium Facade Texture -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1220" />
      <stop offset="40%" stop-color="#101D35" />
      <stop offset="100%" stop-color="#070C16" />
    </linearGradient>

    <!-- Metallic Gold 3D Signage Shading -->
    <linearGradient id="goldSign" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="35%" stop-color="#DFCA9E" />
      <stop offset="60%" stop-color="#C5A46D" />
      <stop offset="85%" stop-color="#9E7D47" />
      <stop offset="100%" stop-color="#6F5326" />
    </linearGradient>

    <linearGradient id="goldAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A46D" stop-opacity="0" />
      <stop offset="30%" stop-color="#DFCA9E" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#C5A46D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9E7D47" stop-opacity="0" />
    </linearGradient>

    <!-- Downlight Spotlights -->
    <radialGradient id="spotlight1" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#DFCA9E" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#101D35" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#101D35" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlight2" cx="70%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#DFCA9E" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#101D35" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#101D35" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Wall Stone Seam Pattern -->
    <pattern id="graniteSeams" width="200" height="120" patternUnits="userSpaceOnUse">
      <rect width="200" height="120" fill="none" stroke="#1A2D4F" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <filter id="drop3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Architectural Wall Background -->
  <rect width="800" height="500" fill="url(#wallGrad)" />
  <rect width="800" height="500" fill="url(#graniteSeams)" />

  <!-- Lighting Cones from Top Architectural Fixtures -->
  <rect width="800" height="500" fill="url(#spotlight1)" />
  <rect width="800" height="500" fill="url(#spotlight2)" />

  <!-- Architectural Reveal Grooves -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#1D3256" stroke-width="1.5" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#1D3256" stroke-width="1.5" />

  <!-- Recessed Architectural Light Fixtures -->
  <rect x="230" y="78" width="40" height="4" rx="2" fill="#DFCA9E" opacity="0.8" />
  <rect x="530" y="78" width="40" height="4" rx="2" fill="#DFCA9E" opacity="0.8" />

  <!-- Centered Metallic 3D Logo Crest (Matching DESTRIA Emblem Geometry) -->
  <g transform="translate(355, 120)" filter="url(#drop3D)">
    <!-- Outer D Frame & Ascending Columns -->
    <path d="M 0,0 L 50,0 C 75,0 90,20 90,50 C 90,80 75,100 50,100 L 0,100 Z M 16,16 L 16,84 L 46,84 C 62,84 72,70 72,50 C 72,30 62,16 46,16 Z" fill="url(#goldSign)" />
    <!-- Ascending Growth Bars within Crest -->
    <rect x="22" y="52" width="10" height="32" fill="url(#goldSign)" />
    <rect x="36" y="36" width="10" height="48" fill="url(#goldSign)" />
    <rect x="50" y="20" width="10" height="64" fill="url(#goldSign)" />
  </g>

  <!-- Dimensional Wordmark -->
  <g filter="url(#drop3D)" text-anchor="middle">
    <text x="400" y="285" font-family="Montserrat, sans-serif" font-size="36" font-weight="800" letter-spacing="12" fill="url(#goldSign)">
      DESTRIA
    </text>
    <text x="400" y="318" font-family="Montserrat, sans-serif" font-size="14" font-weight="600" letter-spacing="8" fill="url(#goldSign)">
      GROUP INC.
    </text>
  </g>

  <!-- Gold Architectural Accent Line -->
  <line x1="220" y1="340" x2="580" y2="340" stroke="url(#goldAccentLine)" stroke-width="1.5" />

  <!-- Institutional Sub-Text -->
  <text x="400" y="375" font-family="Montserrat, sans-serif" font-size="10" font-weight="600" letter-spacing="4" fill="#B8C0CC" text-anchor="middle" opacity="0.85">
    HOLDING &amp; ENTERPRISE MANAGEMENT · NAICS 551114
  </text>
  <text x="400" y="395" font-family="Montserrat, sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#C5A46D" text-anchor="middle" opacity="0.9">
    SHERIDAN, WYOMING, USA
  </text>
</svg>
