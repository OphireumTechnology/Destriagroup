<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="50%" stop-color="#0B1A30" />
      <stop offset="100%" stop-color="#050E1A" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="50%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#9E7D47" />
    </linearGradient>

    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridLines" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1A2D4F" stroke-width="0.75" stroke-opacity="0.4" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1A2D4F" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1000" height="600" fill="url(#bgDeep)" />
  <rect width="1000" height="600" fill="url(#gridLines)" />

  <!-- Ambient Light Halos -->
  <circle cx="500" cy="300" r="280" fill="#0E2445" opacity="0.4" />
  <circle cx="500" cy="300" r="160" fill="#38BDF8" opacity="0.08" filter="url(#glowCyan)" />

  <!-- Central Fiduciary Human Authorization Boundary Ring -->
  <circle cx="500" cy="300" r="190" fill="none" stroke="#C5A46D" stroke-width="1.5" stroke-dasharray="6,8" stroke-opacity="0.5" />
  <circle cx="500" cy="300" r="140" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />

  <!-- Rotating Neural Data Pathways -->
  <g transform="translate(500, 300)">
    <!-- Radial Bus Conduits -->
    <line x1="0" y1="0" x2="-220" y2="-120" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="220" y2="-120" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="-240" y2="120" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="240" y2="120" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4,4" />

    <!-- Core Decision Unit -->
    <rect x="-55" y="-55" width="110" height="110" rx="16" fill="#0C1B33" stroke="url(#goldAccent)" stroke-width="2" />
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#102544" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- AI Symbol & Fiduciary Scales -->
    <text x="0" y="-6" font-family="Montserrat, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
      AI·GOV
    </text>
    <text x="0" y="16" font-family="Montserrat, sans-serif" font-size="9" font-weight="700" fill="#C5A46D" text-anchor="middle" letter-spacing="2">
      DECISION CORE
    </text>
    <text x="0" y="32" font-family="Montserrat, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
      HUMAN AUTHORIZED
    </text>
  </g>

  <!-- Node 1 (Top-Left): Enterprise Intelligence -->
  <g transform="translate(240, 160)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#0F223D" stroke="#C5A46D" stroke-width="1.5" />
    <text x="0" y="-12" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#C5A46D" text-anchor="middle" letter-spacing="1">
      01. INTELLIGENCE
    </text>
    <text x="0" y="6" font-family="Montserrat, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      Consolidated Subsidiary Insights
    </text>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#38BDF8" text-anchor="middle">
      Telemetry Stream: VERIFIED
    </text>
  </g>

  <!-- Node 2 (Top-Right): Risk Monitoring -->
  <g transform="translate(760, 160)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#0F223D" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="-12" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">
      02. RISK MONITORING
    </text>
    <text x="0" y="6" font-family="Montserrat, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      Operational &amp; Market Alerts
    </text>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#34D399" text-anchor="middle">
      Status: NOMINAL (0 ERRORS)
    </text>
  </g>

  <!-- Node 3 (Bottom-Left): Governance Assistance -->
  <g transform="translate(240, 440)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#0F223D" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="-12" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">
      03. GOVERNANCE ASSIST
    </text>
    <text x="0" y="6" font-family="Montserrat, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      Fiduciary Decision Briefs
    </text>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#C5A46D" text-anchor="middle">
      Officer Clearance Req.
    </text>
  </g>

  <!-- Node 4 (Bottom-Right): Audit & Accountability -->
  <g transform="translate(760, 440)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#0F223D" stroke="#C5A46D" stroke-width="1.5" />
    <text x="0" y="-12" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" fill="#C5A46D" text-anchor="middle" letter-spacing="1">
      04. AUDIT &amp; PROOF
    </text>
    <text x="0" y="6" font-family="Montserrat, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">
      Cryptographic Block Chains
    </text>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#34D399" text-anchor="middle">
      SHA-256 Ledger: SEALED
    </text>
  </g>

  <!-- Terminal Data Vector Connections -->
  <circle cx="240" cy="195" r="4" fill="#C5A46D" filter="url(#glowGold)" />
  <circle cx="760" cy="195" r="4" fill="#38BDF8" filter="url(#glowCyan)" />
  <circle cx="240" cy="405" r="4" fill="#38BDF8" filter="url(#glowCyan)" />
  <circle cx="760" cy="405" r="4" fill="#C5A46D" filter="url(#glowGold)" />

  <!-- Outer Header Label -->
  <text x="500" y="50" font-family="Montserrat, sans-serif" font-size="11" font-weight="800" fill="#C5A46D" text-anchor="middle" letter-spacing="4">
    DESTRIA GROUP INC. — AI-ASSISTED GOVERNANCE ARCHITECTURE
  </text>
</svg>
